spring.application.name=ms-auth-user
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/db_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:clave_local_de_desarrollo_no_usar_en_produccion}

spring.flyway.baseline-on-migrate=true

# --- Observabilidad -------------------------------------------------
# Endpoints de Actuator publicados. Se publica solo lo necesario y no
# "*": el resto de los endpoints de Actuator exponen variables de
# entorno, configuracion y volcados de hilos.
management.endpoints.web.exposure.include=health,info,prometheus

# Separa la salud en dos sondas distintas, /actuator/health/liveness y
# /actuator/health/readiness, que es la distincion que hace Kubernetes
# entre "sigue vivo" y "puede recibir trafico".
management.endpoint.health.probes.enabled=true

# Etiqueta todas las metricas con el nombre de la aplicacion, para poder
# distinguirlas de las de otros servicios dentro del mismo Prometheus.
management.metrics.tags.application=${spring.application.name}
