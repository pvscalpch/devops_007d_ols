# =====================================================================
# PLANTILLA del Secret - NO contiene credenciales reales
#
# Por que este archivo lleva ".example" y no se aplica tal cual:
#
# 1. Un Secret de Kubernetes NO cifra nada. El campo "data" es base64,
#    que es una codificacion, no un cifrado: cualquiera que lea el YAML
#    recupera el valor con un comando. Versionar el Secret real seria
#    equivalente a escribir las contrasenas en texto plano en el
#    repositorio.
#
# 2. La auditoria de GitLeaks del pipeline detectaria esas credenciales
#    y haria fallar la ejecucion, que es exactamente lo que debe pasar.
#
# El Secret real se crea de forma imperativa contra el cluster, sin que
# los valores pasen nunca por Git:
#
#   kubectl create secret generic ms-auth-user-secrets \
#     --namespace ms-auth-user \
#     --from-literal=mysql-root-password='<clave generada>' \
#     --from-literal=jwt-secret='<clave de al menos 32 caracteres>'
#
# En un entorno real la fuente de esos valores seria un gestor externo
# (AWS Secrets Manager, HashiCorp Vault) consumido por el operador
# External Secrets, de modo que el cluster los obtenga solo en tiempo de
# ejecucion y el repositorio siga sin contener ninguno.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ms-auth-user-secrets
  namespace: ms-auth-user
type: Opaque
stringData:
  mysql-root-password: "REEMPLAZAR-EN-EL-CLUSTER"
  # HS256 exige una clave de 256 bits, es decir 32 caracteres como minimo.
  jwt-secret: "REEMPLAZAR-EN-EL-CLUSTER-MINIMO-32-CARACTERES"
