name: CI - ms-auth-user

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Escalabilidad del pipeline: si se empuja dos veces seguidas a la
# misma rama, la ejecucion anterior se cancela en vez de competir
# por los runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Entorno cloud simulado: base de datos efimera solo para este pipeline
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 17 con cache de dependencias Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compilar, migrar con Flyway y ejecutar pruebas
        run: ./mvnw -B -ntp verify
        env:
          SPRING_DATASOURCE_URL: 'jdbc:mysql://127.0.0.1:3306/db_auth?useSSL=false&allowPublicKeyRetrieval=true'
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'clave-solo-para-pruebas-de-ci-1234567890' }}

      - name: Publicar el artefacto .jar generado
        uses: actions/upload-artifact@v4
        with:
          name: ms-auth-user-jar
          path: target/*.jar
          if-no-files-found: error

  docker-build:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar contra GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ms-auth-user
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # En los Pull Request se construye para verificar que el
      # Dockerfile sigue siendo valido, pero no se publica nada.
      - name: Construir imagen y publicar en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar trazabilidad de la imagen
        if: always()
        run: |
          echo "## Imagen construida" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Publicada | ${{ github.event_name != 'pull_request' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Estado | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
