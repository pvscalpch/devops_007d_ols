name: CI - ms-auth-user

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Escalabilidad del pipeline: si se empuja dos veces seguidas a la
# misma rama, la ejecucion anterior se cancela en vez de competir
# por los runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ms-auth-user

jobs:

  # =================================================================
  # IE2 - Pruebas unitarias: rapidas, sin base de datos
  # =================================================================
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17 con cache de dependencias Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Se excluyen las pruebas etiquetadas como de integracion:
      # este job corre sin base de datos y debe ser rapido.
      - name: Ejecutar las pruebas unitarias
        run: ./mvnw -B -ntp test jacoco:report -DexcludedGroups=integration

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: target/site/jacoco
          if-no-files-found: ignore

  # =================================================================
  # IE2 - Pruebas de integracion: con MySQL y migraciones Flyway
  # =================================================================
  integration-tests:
    name: Pruebas de integracion
    runs-on: ubuntu-latest
    needs: [unit-tests]
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17 con cache de dependencias Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compilar, migrar con Flyway y verificar
        run: ./mvnw -B -ntp verify
        env:
          SPRING_DATASOURCE_URL: 'jdbc:mysql://127.0.0.1:3306/db_auth?useSSL=false&allowPublicKeyRetrieval=true'
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'clave-solo-para-pruebas-de-ci-1234567890' }}

      - name: Publicar el artefacto .jar generado
        uses: actions/upload-artifact@v4
        with:
          name: ms-auth-user-jar
          path: target/*.jar
          if-no-files-found: error

  # =================================================================
  # IE3 - Analisis estatico de codigo con SonarCloud
  # El Quality Gate bloquea: si no se cumple, el job falla y el
  # pipeline se detiene antes de construir la imagen.
  # =================================================================
  code-analysis:
    name: Analisis de codigo (SonarCloud)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    timeout-minutes: 20
    # Solo en push: el analisis de un Pull Request requiere que la
    # GitHub App de SonarCloud tenga acceso al repositorio, y el
    # proyecto esta registrado en otra organizacion. En los push se
    # analiza la rama, que no necesita esa integracion.
    if: github.event_name == 'push'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_auth
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para atribuir
          # cada linea a su autor y distinguir el codigo nuevo.
          fetch-depth: 0

      - name: Instalar JDK 17 con cache de dependencias Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Cachear los datos de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analizar el codigo y esperar el Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: 'jdbc:mysql://127.0.0.1:3306/db_auth?useSSL=false&allowPublicKeyRetrieval=true'
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'clave-solo-para-pruebas-de-ci-1234567890' }}
        run: >-
          ./mvnw -B -ntp verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Resumen del analisis de codigo
        if: always()
        run: |
          echo "## Analisis de codigo (SonarCloud)" >> $GITHUB_STEP_SUMMARY
          echo "- Proyecto: cristianbv1256-bit_devops_007d_ols" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate bloqueante: si" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # =================================================================
  # IE1 - Construccion y publicacion de la imagen
  # =================================================================
  docker-build:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [integration-tests]
    timeout-minutes: 20

    # SonarCloud corre en paralelo y reporta su Quality Gate como un
    # check propio. El bloqueo del pipeline lo ejerce Trivy sobre la
    # imagen, en el job de seguridad.
    if: ${{ !cancelled() && needs.integration-tests.result == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar contra GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # En los Pull Request se construye para verificar que el
      # Dockerfile sigue siendo valido, pero no se publica nada.
      - name: Construir imagen y publicar en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # IE3 - Seguridad: escaneo con bloqueo si hay vulnerabilidades
  # =================================================================
  security:
    name: Analisis de seguridad
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 15

    # La omision de SonarCloud en los Pull Request no debe propagarse
    # por la cadena y dejar sin ejecutar el escaneo de seguridad.
    if: ${{ !cancelled() && needs.docker-build.result == 'success' }}

    permissions:
      contents: read
      security-events: write   # para publicar los hallazgos en la pestana Security

    steps:
      - uses: actions/checkout@v4

      # Las dependencias declaradas: detecta librerias vulnerables
      # en el pom.xml sin necesidad de construir nada.
      # Modo offline: Trivy no consulta Maven Central para resolver
      # los .pom. Sin esto el escaneo falla con un 429, porque la IP
      # del runner es compartida y el repositorio la bloquea.
      - name: Escanear dependencias del proyecto
        continue-on-error: true   # informativo: no bloquea el pipeline
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-dependencias.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      # La publicacion de los hallazgos es informativa: si fallara,
      # no debe tumbar el job, porque el bloqueo real lo aporta el
      # escaneo de la imagen que viene despues.
      - name: Publicar hallazgos en la pestana Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dependencias.sarif
          category: dependencias

      # La imagen construida: sistema operativo base + la aplicacion.
      # Este si bloquea: exit-code 1 hace fallar el job y, con la regla
      # de proteccion de rama, impide el merge.
      - name: Escanear la imagen y bloquear si hay vulnerabilidades criticas
        if: github.event_name != 'pull_request'   # en un PR la imagen aun no se publica
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'   # ESTE es el bloqueo que pide el encargo

      - name: Resumen del analisis
        if: always()
        run: |
          echo "## Analisis de seguridad" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencias del proyecto: escaneadas (informativo)" >> $GITHUB_STEP_SUMMARY
          echo "- Imagen de contenedor: bloqueante ante severidad CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # =================================================================
  # IE4 - Despliegue automatico en entorno cloud simulado
  # =================================================================
  deploy:
    name: Desplegar en entorno simulado
    runs-on: ubuntu-latest
    needs: [security]
    if: >-
      !cancelled()
      && needs.security.result == 'success'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar contra GHCR para descargar la imagen
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar las variables del entorno
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=clave-efimera-de-staging
          MYSQL_DATABASE=db_auth
          JWT_SECRET=${{ secrets.JWT_SECRET || 'clave-solo-para-staging-1234567890abcdef' }}
          APP_PORT=8090
          IMAGE_TAG=sha-${{ github.sha }}
          EOF

      # Despliega exactamente la imagen de este commit, no "latest":
      # eso es lo que hace el despliegue trazable.
      - name: Levantar el stack orquestado
        run: docker compose up -d --no-build --wait

      - name: Verificar que el servicio quedo operativo
        run: |
          for i in $(seq 1 20); do
            RESP=$(curl -fsS http://localhost:8090/api/health || true)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "Servicio operativo en el intento $i"
              echo "$RESP"
              exit 0
            fi
            sleep 5
          done
          echo "El servicio no respondio a tiempo"
          docker compose ps
          docker compose logs
          exit 1

      - name: Registrar la trazabilidad del despliegue
        if: always()
        run: |
          echo "## Despliegue en entorno simulado" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagen desplegada | \`${{ env.IMAGE }}:sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Entorno | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| Resultado | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Guardar los logs del despliegue
        if: always()
        run: docker compose logs > logs-despliegue.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-despliegue
          path: logs-despliegue.txt
          if-no-files-found: ignore

      - name: Desmontar el entorno
        if: always()
        run: docker compose down -v
